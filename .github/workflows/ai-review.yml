name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # No checkout: the review reads the diff via the GitHub MCP server (API),
      # not the local tree. (The repo also has a broken `foodplanner/flutter`
      # gitlink that makes actions/checkout fail.)
      - name: Prepare prompt context
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          # GIRAF-specific review guidance, injected as additional_context so the
          # official code-review extension applies our rules on top of its own.
          ADDITIONAL_CONTEXT: |
            This is foodplanner, the GIRAF meal-planning Flutter app (app code in
            foodplanner/lib/, tests in foodplanner/test/). The PR author is a JUNIOR
            university student new to the codebase — explain WHY each finding matters and
            cite the rule, so the review also teaches. No flattery.

            DO NOT comment on (CI/static tools own these): flutter test failures, dart
            format / formatting, analyzer & lint nits, unused imports, naming-only nits,
            type errors. DO NOT review generated code: foodplanner/lib/api/openapi/**,
            *.g.dart, *.freezed.dart.

            FOCUS on what static tools cannot see, in priority order:
            1. Security (highest weight): secrets/API keys/tokens committed in code or
               config; trusting a client-supplied role instead of the validated JWT
               (GIRAF auth: giraf-core issues JWTs with org_roles; authorisation must come
               from the validated token, hierarchy owner > admin > member); missing
               ownership checks; PII (child/citizen) data in logs or error messages.
            2. Correctness: null handling at boundaries, off-by-one, swallowed errors,
               races, missing await, state that won't rebuild.
            3. Flutter/architecture (GIRAF standards): Single Responsibility — widgets do
               UI only, not business logic / API calls / data transformation; missing
               dispose() for controllers/subscriptions; missing `if (!mounted) return;`
               after await before setState(); deprecated APIs (RaisedButton/FlatButton,
               WillPopScope, MaterialStateProperty); unsafe `!` null-assertion; hardcoded
               colours instead of Theme.of(context); GIRAF shared concepts (users, orgs,
               citizens, grades, pictograms, auth) re-implemented here instead of in
               giraf-core. CALIBRATE to project size — do NOT push juniors toward
               overengineering; only Single Responsibility always applies; don't demand
               new interfaces/use-cases/mappers without 2+ implementations or a test that
               needs to mock.

            Submit the review as event type COMMENT only. Never APPROVE or REQUEST_CHANGES
            — a human supervisor approves. If the PR is clean, say "No blocking concerns."
            and do not invent findings.
        run: |
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' \
            > .gemini/context.json

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          gemini_debug: true
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review'
