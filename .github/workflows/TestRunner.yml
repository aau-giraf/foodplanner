name: Flutter Tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./foodplanner
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
     
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    # Download OpenAPI spec from hardcoded artifact URL
    - name: Download OpenAPI spec from artifact URL
      run: |
        # Replace this URL with your specific artifact download URL
        ARTIFACT_URL="https://github.com/aau-giraf/foodplanner-api/actions/runs/18167395315/artifacts/4155999575"
        
        echo "Downloading from artifact URL: $ARTIFACT_URL"
        curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "$ARTIFACT_URL" \
          -o openapi.zip
        unzip openapi.zip
        ls -lh openapi.json
    
    # Verify the OpenAPI file was downloaded
    - name: Verify OpenAPI file
      working-directory: ./foodplanner
      run: |
        if [ -f openapi.json ]; then
          echo "✓ OpenAPI file found"
          echo "File size: $(ls -lh openapi.json | awk '{print $5}')"
          echo "First 5 lines:"
          head -n 5 openapi.json
        else
          echo "✗ OpenAPI file not found!"
          echo "Contents of current directory:"
          ls -la
          exit 1
        fi
    
    # Install OpenAPI generator
    - name: Install OpenAPI Generator
      run: |
        dart pub global activate openapi_generator_cli
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
    
    # Generate API client from the downloaded OpenAPI spec
    - name: Generate API client
      working-directory: ./foodplanner
      run: |
        openapi-generator generate \
          -i openapi.json \
          -g dart \
          -o lib/generated \
          --additional-properties=pubName=foodplanner_api,pubAuthor=Giraf
       
    - name: Get dependencies
      run: flutter pub get
     
    - name: Run tests
      run: flutter test test/service_tests --coverage --reporter expanded