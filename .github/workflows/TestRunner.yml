name: Flutter Tests
on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./foodplanner
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
     
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
   
    # Download OpenAPI spec from another repository
    - name: Download OpenAPI spec from artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        repo: aau-giraf/foodplanner-api
        workflow: generate-openapi-json.yml  # e.g., build.yml or openapi-generation.yml
        branch: staging  # e.g., main, master, or develop
        name: openapi-json  # The name of the artifact (as specified in the upload step)
        path: ./foodplanner
        # Optional: search for successful runs only
        workflow_conclusion: success
   
    # Verify the OpenAPI file was downloaded
    - name: Verify OpenAPI file
      working-directory: ./foodplanner
      run: |
        if [ -f openapi.json ]; then
          echo "✓ OpenAPI file found"
          echo "File size: $(ls -lh openapi.json | awk '{print $5}')"
          echo "First 5 lines:"
          head -n 5 openapi.json
        else
          echo "✗ OpenAPI file not found!"
          echo "Contents of current directory:"
          ls -la
          exit 1
        fi
   
    # Install OpenAPI generator
    - name: Install OpenAPI Generator
      run: |
        dart pub global activate openapi_generator_cli
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
   
    # Generate API client from the downloaded OpenAPI spec
    - name: Generate API client
      working-directory: ./foodplanner
      run: |
        # Generate to the correct path that matches your imports
        openapi-generator generate \
          -i openapi.json \
          -g dart \
          -o lib/api/openapi \
          --additional-properties=pubName=foodplanner_api,pubAuthor=Giraf
       
    - name: Get dependencies
      run: flutter pub get
      
    # Needs a new test_build_runner that assumes openAPI code has been generated already
    #- name: Build project
      #run: dart run build_runner build --delete-conflicting-outputs
     
    - name: Run tests
      run: flutter test test/service_tests --coverage --reporter expanded
