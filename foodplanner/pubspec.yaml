name: foodplanner
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ^3.5.3

dependencies:
    # The following adds the Cupertino Icons font to your application.
    # Use with the CupertinoIcons class for iOS style icons.
    cupertino_icons: ^1.0.8
    # Added camera dependency for camera widget
    camera: ^0.11.0+2
    image: ^3.0.1
    # Plugin for saving images to photos gallery
    gal: ^2.3.0
    image_picker: ^1.1.2
    flutter_sficon: ^1.1.2
    webview_flutter: ^2.0.10
    http: ^1.2.2
    jwt_decoder: ^2.0.1
    auto_size_text: ^3.0.0
    permission_handler: ^10.2.0

    flutter:
        sdk: flutter
    go_router: ^14.3.0

    validators: ^3.0.0

  
    provider: ^6.1.2
    dropdown_button2: ^2.3.9
    flutter_secure_storage: ^9.2.2
    intl: ^0.19.0
    openapi_generator_annotations: ^6.0.0
    global_configuration: ^2.0.0
    local_auth: ^2.3.0
    path_provider: ^2.1.5
    flutter_advanced_switch: ^3.1.0
    flutter_advanced_segment: ^3.0.2
    http_parser: ^4.0.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    openapi_generator: ^6.0.0
    build_runner: ^2.4.13
    mockito: ^5.4.4

    flutter_lints: ^5.0.0
    test: ^1.25.8

flutter:
    uses-material-design: true
    assets:
        - assets/images/logo.png
